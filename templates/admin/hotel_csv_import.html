{% extends "admin/base.html" %}
{% block title %}Import hotel CSV — Admin{% endblock %}

{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">Import hotels CSV</h1>
    <a href="{{ url_for('admin.hotel_csv_index') }}" class="btn btn-link">Back</a>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
                <label class="form-label">CSV file</label>
                <input type="file" name="file" class="form-control" accept=".csv" required>
                <div class="form-text">
                    Must have columns: HotelId, HotelName, RoomTypeId, RoomTypeName
                </div>
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" name="replace" class="form-check-input" id="replace">
                <label class="form-check-label" for="replace">
                    <strong>Replace all existing rates</strong> (deletes all room_rates first)
                </label>
            </div>

            <div class="d-flex gap-2">
                <button class="btn btn-primary">
                    <i class="bi bi-upload"></i> Import
                </button>
                <a href="{{ url_for('admin.hotel_csv_export') }}" class="btn btn-outline-secondary">
                    <i class="bi bi-download"></i> Download current CSV first
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
