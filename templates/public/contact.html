{% extends "base.html" %}

{% block title %}Contact — {{ config.APP_NAME }}{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row">
            <div class="col-lg-6 mx-auto">
                <h1 class="mb-4">Get in touch</h1>
                <p class="text-muted">
                    Have a question about a hotel or reservation? Send us a
                    message and we'll get back to you within one business day.
                </p>

                <form method="POST" action="{{ maybe_url('public.enquiry_submit') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="name" class="form-label">Your name</label>
                        <input type="text" name="name" id="name"
                               class="form-control" required maxlength="120">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" name="email" id="email"
                               class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone (optional)</label>
                        <input type="tel" name="phone" id="phone"
                               class="form-control" maxlength="40">
                    </div>

                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea name="message" id="message" rows="5"
                                  class="form-control" required
                                  maxlength="2000"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-send"></i> Send message
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
